name: Feature Validation

on:
  push:
    branches: [ "feature/production-upgrades" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore RealEstate.sln
      - name: Build
        run: dotnet build RealEstate.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/RealEstate.UnitTests/RealEstate.UnitTests.csproj --configuration Release --no-build --verbosity normal
      - name: Verify migrations exist
        shell: bash
        run: |
          test -d src/RealEstate.Infrastructure/Migrations
          test "$(find src/RealEstate.Infrastructure/Migrations -maxdepth 1 -type f -name '*.cs' | wc -l)" -ge 2
