name: Generate EF Migrations

on:
  push:
    branches: [ "feature/production-upgrades" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/production-upgrades
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RealEstate.sln

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Generate migration when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "src/RealEstate.Infrastructure/Migrations" ]; then
            dotnet ef migrations add ProductionUpgrades \
              --project src/RealEstate.Infrastructure/RealEstate.Infrastructure.csproj \
              --startup-project src/RealEstate.Api/RealEstate.Api.csproj \
              --output-dir Migrations
          else
            echo "Migrations directory already exists; no new migration generated."
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/RealEstate.Infrastructure/Migrations; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RealEstate.Infrastructure/Migrations
          git commit -m "chore: add EF migration for production upgrades"
          git push origin HEAD:feature/production-upgrades
