name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RealEstate.sln

      - name: Build
        run: dotnet build RealEstate.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/RealEstate.UnitTests/RealEstate.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Docker Compose build
        run: docker compose build

      - name: Start SQL Server and API
        run: docker compose up -d

      - name: Wait for API
        shell: bash
        run: |
          set -e
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8080/swagger/index.html > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 3
          done
          echo "API did not become ready"
          docker compose ps
          docker compose logs --no-color api sql
          exit 1

      - name: Smoke test Swagger
        run: curl --fail --silent --show-error http://localhost:8080/swagger/index.html > /dev/null

      - name: Smoke test login
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@smartrealestate.local","password":"Password123!"}' \
            http://localhost:8080/api/auth/login)
          echo "$response"
          python - <<'PY' "$response"
import json, sys
payload = json.loads(sys.argv[1])
token = payload.get("data", {}).get("token") or payload.get("token")
if not token:
    raise SystemExit("Login smoke test failed: JWT token was not returned")
print("Login smoke test passed")
PY

      - name: Smoke test properties endpoint
        run: |
          curl --fail --silent --show-error \
            'http://localhost:8080/api/properties?page=1&pageSize=10' > /dev/null
          echo "Properties smoke test passed"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color api sql

      - name: Shutdown containers
        if: always()
        run: docker compose down -v
