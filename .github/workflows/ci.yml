name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RealEstate.sln

      - name: Build
        run: dotnet build RealEstate.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/RealEstate.UnitTests/RealEstate.UnitTests.csproj --configuration Release --no-build
