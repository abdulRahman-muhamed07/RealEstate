services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RealEstate!Sql2026Strong"
    ports:
      - "1433:1433"
    volumes:
      - realestate_sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", " /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RealEstate!Sql2026Strong' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/RealEstate.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=RealEstateDb;User Id=sa;Password=RealEstate!Sql2026Strong;TrustServerCertificate=True;"
      Jwt__Key: "RealEstate.LocalDevelopment.JwtKey.2026.ChangeForProduction!"
      Jwt__Issuer: "RealEstate.Api"
      Jwt__Audience: "RealEstate.Client"
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy

volumes:
  realestate_sql:
